# CI/CD — Site institucional Bahia Service (Next.js static export → HostGator FTP)
#
# Secrets obrigatórios:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# Secrets/vars opcionais:
#   FTP_PORT          (padrão: 21)
#   FTP_SERVER_DIR    (padrão: ./)  ← caminho relativo ao login FTP
#   PRODUCTION_URL    (padrão: https://www.bahiaservice.com.br)
#
# HostGator — escolha de FTP_SERVER_DIR:
#   - FTP já entra em public_html  → use ./
#   - FTP entra na home da conta   → use public_html/
#   NÃO use /public_html/ (barra inicial) se o usuário FTP já estiver em public_html.
#
# Build: next.config.ts → output: "export" → pasta `out/`

name: Deploy HostGator

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostgator-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://www.bahiaservice.com.br' }}

jobs:
  build-and-deploy:
    name: Build & Deploy to public_html
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (static export)
        run: |
          set -euo pipefail
          npm run build

      - name: Stamp deploy version
        run: |
          set -euo pipefail
          if [ ! -d out ] || [ ! -f out/index.html ]; then
            echo "❌ Pasta out/ inválida após o build"
            ls -la
            exit 1
          fi
          {
            echo "${{ github.sha }}"
            echo "${{ github.ref_name }}"
            date -u +%Y-%m-%dT%H:%M:%SZ
          } > out/deploy-version.txt
          echo "📝 deploy-version.txt:"
          cat out/deploy-version.txt
          echo "📦 Conteúdo de out/:"
          ls -la out | head -40

      - name: Resolve FTP server directory
        id: ftpdir
        env:
          # Preferir secret; se vazio, usar ./ (FTP já dentro de public_html — caso HostGator mais comum)
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          DIR="${RAW_DIR:-./}"

          # Valor antigo do workflow (/public_html/) costuma NÃO atualizar o site
          # quando o usuário FTP da HostGator já inicia dentro de public_html.
          if [ "$DIR" = "/public_html" ] || [ "$DIR" = "/public_html/" ]; then
            echo "⚠️ FTP_SERVER_DIR=/public_html/ detectado — convertendo para ./ (corrige deploy fantasma)."
            echo "   Se o FTP entrar na HOME da conta (não em public_html), defina o secret como: public_html/"
            DIR="./"
          fi

          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
          echo "📁 FTP server-dir resolvido: '${DIR}'"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./out/
          server-dir: ${{ steps.ftpdir.outputs.dir }}
          dangerous-clean-slate: false
          security: loose
          timeout: 600000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/cgi-bin/**
            **/.well-known/**
            error_log
            **/error_log

      - name: Verify production received this commit
        id: verify
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: ${{ env.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          echo "🔍 Verificando ${SITE_URL}/deploy-version.txt"
          echo "SHA esperado: ${EXPECTED_SHA}"

          # HostGator / DNS podem atrasar alguns segundos
          for attempt in 1 2 3 4 5 6; do
            echo "Tentativa ${attempt}..."
            if BODY=$(curl -fsSL --max-time 20 "${SITE_URL}/deploy-version.txt" 2>/dev/null); then
              echo "Conteúdo remoto:"
              echo "$BODY"
              if echo "$BODY" | head -n1 | grep -q "${EXPECTED_SHA}"; then
                echo "✅ Deploy confirmado no site público"
                exit 0
              fi
              echo "⚠️ Arquivo existe, mas SHA diferente (deploy pode ter ido para outra pasta FTP)"
            else
              echo "⚠️ deploy-version.txt ainda não acessível em ${SITE_URL}"
            fi
            sleep 10
          done

          echo "::error::O Actions fez upload FTP, mas o site público NÃO serve este commit."
          echo "Causa mais comum na HostGator: FTP_SERVER_DIR errado."
          echo "  - Se o FTP já abre dentro de public_html → defina o secret FTP_SERVER_DIR como ./"
          echo "  - Se o FTP abre na home da conta → defina FTP_SERVER_DIR como public_html/"
          echo "Site ainda parece servir a versão antiga de 05/08 (manual)."
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "FTP server-dir: ${{ steps.ftpdir.outputs.dir }}"
          echo "Production URL: ${{ env.PRODUCTION_URL }}"
          echo "Verify result: ${{ steps.verify.outcome }}"

      - name: Fail job if production was not updated
        if: steps.verify.outcome != 'success'
        run: exit 1
